<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF 图像压缩</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="custom-alert" class="hide"></div>

  <div id="main-form">
    <h1>PDF 图像压缩</h1>
    <p class="reg">上传图像扫描 PDF，压缩后下载</p>
      <label class="custom-file-button">
        选择 PDF 文件
        <input type="file" id="pdf-upload" accept="application/pdf" />
      </label>
      <p id="fileName" class="reg"></p>
  
      <button type="button" id="compress-btn" class="custom-button">压缩并下载</button>

    <div id="result" style="margin-top: 20px; color: white;"></div>
  </div>

  <footer id="custom-footer">
    <span>© 2025 &nbsp;|&nbsp;</span>
    <a href="https://www.sparkfade.top/" target="_blank">我的主页</a>
    <span>&nbsp;|&nbsp;</span>
    <a href="https://github.com/LYCaikano/pdfcompress" target="_blank">GitHub 项目地址</a>
  </footer>  

  
  <script src="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/pdf.js/2.13.216/pdf.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
